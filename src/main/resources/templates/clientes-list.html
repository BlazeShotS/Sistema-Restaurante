<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Mostrar todo los clientes</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"> <!-- Agrega Bootstrap Icons -->        
    </head>
    <body>
        
        <div class="col-md-3 mb-2">
            <a href="/trabajador/panel" class="btn btn-primary w-100">Ir al panel</a>
        </div>

        <main class="col-md-auto container mt-5">
            <h2 class="text-white bg-primary p-3 text-center" style="font-family: Arial, sans-serif;">Registro de Clientes</h2>

            <div class="table-responsive">
                <table class="table table-bordered table-hover shadow-sm">
                    <thead class="bg-primary text-white" style="font-family: Arial, sans-serif;">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Apellido</th>
                            <th scope="col">Telefono</th>
                            <th scope="col">Email</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Aca esta haciendo como un get, capturando el objeto con sus atributos y colocandolo en la tabla -->
                        <tr th:each="cliente : ${clientes}">
                            <td th:text="${cliente.idCliente}"></td>
                            <td th:text="${cliente.nombre}"></td>
                            <td th:text="${cliente.apellido}"></td>
                            <td th:text="${cliente.telefono}"></td>
                            <td th:text="${cliente.email}"></td>
                            <td>                                
                                <a class="btn btn-danger" th:href="@{/cliente/eliminar/{id}(id=${cliente.idCliente})}"
                                   onclick="return confirm ('¿Estás seguro que deseas eliminar?')">
                                    <i class="fas fa-trash-alt"></i> Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    </body>
</html>
