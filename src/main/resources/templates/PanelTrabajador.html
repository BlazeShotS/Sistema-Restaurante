<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>PANEL</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"> <!-- Agrega Bootstrap Icons -->

    <body>

      
        
        <main class="col-md-auto container mt-5">
            <!-- Encabezado de éxito -->
            <h1 class="text-center text-success mb-4" style="font-family: Arial;">Iniciaste sesión exitosamente</h1>

            <!-- Contenedor de botones, ahora centrado -->
            <div class="row justify-content-center">
               

                <!-- Botón Mostrar todos los clientes -->
                <div class="col-md-3 mb-2">
                    <a href="/cliente" class="btn btn-primary w-100">
                        Mostrar todos los clientes
                    </a>
                </div>
                
                <div class="col-md-3 mb-2">
                    <a href="/plato" class="btn btn-primary w-100">
                        Mostrar todos los Platos
                    </a>
                </div>
                
                <div class="col-md-3 mb-2">
                    <a href="/plato/nuevo" class="btn btn-primary w-100">
                        Agregar un nuevo plato
                    </a>
                </div>
                
                <div class="col-md-3 mb-2">
                    <a href="/pedido/platos" class="btn btn-primary w-100">

                    </a>
                </div>
                
                
                
            </div>
        </main>
        
        
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
