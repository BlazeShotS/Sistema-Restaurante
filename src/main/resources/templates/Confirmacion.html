<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Confirmacion</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"> <!-- Agrega Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">    
    </head>
    <body>

        
        <div class="container mt-5">
            <h1 class="text-center mb-4 text-primary">Confirmación de Pedido</h1>

            <div th:if="${mensaje}">
                <div class="alert alert-info" role="alert" th:text="${mensaje}"></div>
            </div>

            <div th:if="${compra}">
                <h2 class="mb-4 text-success">Detalles de su pedido</h2>

                <h4>ID de la compra: <span th:text="${compra.idCompra}"></span></h4> <!-- Aquí se muestra el id_compra -->

                <table class="table table-striped table-bordered table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>Plato</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="detalle : ${compra.detalles}">
                            <td th:text="${detalle.plato.nombre}"></td>
                            <td th:text="${detalle.cantidad}"></td>
                            <td th:text="${detalle.precioUnitario}"></td>
                            <td th:text="${detalle.subtotal}"></td>
                        </tr>
                    </tbody>
                </table>

                <div class="d-flex justify-content-end">
                    <h3 class="text-end text-info">Total: <span th:text="${compra.total}"></span></h3>
                </div>

                <p class="text-center mt-4 text-muted">Gracias por tu pedido, ¡Ahora lo llevamos!</p>
            </div>

            <div class="d-flex justify-content-center mt-4">
                <button type="button" class="btn btn-dark btn-lg" onclick="ImprimirPagina()">Imprimir</button>
            </div>
        </div>

        
        
        <script>
            function ImprimirPagina() {
            window.print();
            }
        </script>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0UmebWNSk5r2/L4mBVVF2+nA6j7K6X9U1cQA+vHw0Pfg6OHb" crossorigin="anonymous"></script>

    </body>
</html>
