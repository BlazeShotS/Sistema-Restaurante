<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Login Cliente</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"> <!-- Agrega Bootstrap Icons -->        
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    </head>
    <body>
        
        
        <!-- Encabezado tipo barra de navegación -->
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark py-3">
            <div class="container-fluid">
                
                <!-- Botón para dispositivos pequeños -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navegación principal -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/pedido/platos">
                                <i class="bi bi-list"></i> Mostrar Platos Completos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/cliente/loginCliente">
                                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/cliente/nuevo">
                                <i class="bi bi-person-plus"></i> Registrarse
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/compras/mostrarCarrito">
                                <i class="bi bi-cart"></i> Visualizar Pedidos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/trabajador/login">
                                <i class="bi bi-person-badge"></i> Acceso para Trabajadores
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        
        
        <main class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-5" style="background: linear-gradient(145deg, #ffffff, #f1f1f1); border-radius: 15px;">
                            <h3 class="text-center mb-4" style="font-weight: 700; color: #333;">Bienvenido</h3>
                            <form th:action="@{/cliente/login}" method="post">
                                <div class="form-floating mb-4">
                                    <input type="number" class="form-control rounded-3" id="id" name="id" placeholder="DNI" required>
                                    <label for="id"><i class="bi bi-person-badge"></i> DNI</label>
                                </div>
                                <div class="form-floating mb-4">
                                    <input type="password" class="form-control rounded-3" id="contrasena" name="contrasena" placeholder="Contraseña" required>
                                    <label for="contrasena"><i class="bi bi-lock"></i> Contraseña</label>
                                </div>
                                <div th:if="${error}" class="text-danger text-center mb-3" th:text="${error}"></div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary rounded-3 py-2" style="font-weight: 600;">Iniciar Sesión</button>
                                </div>
                            </form>
                            <div class="text-center mt-4">
                                <p class="mb-1">¿No tienes cuenta? <a href="/cliente/nuevo" class="text-decoration-none fw-bold text-primary">Regístrate</a></p>
                                <p class="mb-0"><a href="#" class="text-decoration-none text-secondary">¿Olvidaste tu contraseña?</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        
        <footer class="bg-dark text-white text-center py-3">
            <div class="container">
                <p class="mb-1">© 2024 El Punto del sabor. Todos los derechos reservados.</p>
                <p class="mb-0">
                    <a href="/terminos" class="text-white text-decoration-none me-3">Términos y Condiciones</a>
                    <a href="/privacidad" class="text-white text-decoration-none">Política de Privacidad</a>
                </p>
            </div>
        </footer>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    </body>
</html>
