<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Plato Lista</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"> <!-- Agrega Bootstrap Icons -->
    </head>
    <body>
        
        <div class="col-md-3 mb-2">
            <a href="/trabajador/panel" class="btn btn-primary w-100">Ir al panel</a>
        </div>
        
        <!--LA TABLA-->
        <main class="col-md-auto container mt-5">
            <h2 class="text-white bg-dark p-3" style="font-family: Arial;">Registro de productos</h2>
            <div class="table-responsive small">
                <table  class="table table-striped">
                    <thead class="bg-dark text-white" style="font-family: Arial;">
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Descripcion</th>
                            <th scope="col">Precio</th>
                            <th scope="col">Stock</th>
                            <th scope="col">Fecha de Ingreso</th>
                            <th scope="col">Id administrador</th>
                            <th scope="col">Imagen</th>
                            <th scope="col">Accion</th>
                        </tr>
                    </thead>
                    <tbody> <!--Aca esta haciendo como un get ,capturando el objeto con sus atributos y colocandolo en la tabla -->
                        <tr th:each="plato : ${platos}">
                            <td th:text="${plato.id_plato}"></td>
                            <td th:text="${plato.nombre}"></td>
                            <td th:text="${plato.descripcion}"></td>
                            <td th:text="${plato.precio}"></td>
                            <td th:text="${plato.stock}"
                                th:style="${plato.stock < 5} ? 'color: red; font-size: 1.2rem; font-family: fantasy;' " >                                
                            </td>
                            <td th:text="${plato.fechaIngreso}"></td>
                            <td th:text="${plato.trabajador.id_trabajador}"></td>
                            <td>
                                <img th:src="${plato.rutaImagen}" alt="Imagen del Producto" style="max-width: 100px; max-height: 100px;" />                                              
                            </td>                          
                            <td>
                                <a class="btn btn-outline-info mb-3" th:href="@{/plato/editar/{id}(id=${plato.id_plato})}">Editar</a>
                                <a class="btn btn-danger" th:href="@{/plato/eliminar/{id}(id=${plato.id_plato})}"
                                   onclick="return confirm ('¿Estas seguro que deseas eliminar?')">
                                 Eliminar</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>                        
        
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    </body>
</html>
