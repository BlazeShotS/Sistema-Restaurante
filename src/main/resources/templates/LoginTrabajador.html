<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>LOGIN CLIENTE</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"> <!-- Agrega Bootstrap Icons -->
    </head>
    <body>
        

        <h1 class="text-center text-primary mb-4" style="font-size: 2.5rem; font-weight: 600;">Bienvenido Trabajador</h1>    
        
        <div class="container mt-0.4 d-flex justify-content-center align-items-center" style="min-height: 75vh;">
            <div class="card shadow-lg" style="width: 100%; max-width: 400px; border-radius: 15px;">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4" style="color: #007bff;">Iniciar Sesión</h2>
                    <form th:action="@{/trabajador/login}" method="post">
                        <div class="mb-3">
                            <label for="id" class="form-label">ID:</label>
                            <input 
                                type="text" 
                                id="id" 
                                name="id" 
                                class="form-control" 
                                placeholder="Ingrese su ID" 
                                required
                                style="border-radius: 10px;" />
                        </div>                                    
                        <div class="mb-3">
                            <label for="contrasena" class="form-label">Contraseña:</label>
                            <input 
                                type="password" 
                                id="contrasena" 
                                name="contrasena" 
                                class="form-control" 
                                placeholder="Ingrese su contraseña" 
                                required 
                                style="border-radius: 10px;" />
                        </div>
                        <div class="d-grid">
                            <button 
                                class="btn btn-primary btn-lg" 
                                type="submit" 
                                style="border-radius: 10px;">Iniciar Sesión
                            </button>
                        </div>
                        <div 
                            th:if="${error}" 
                            class="text-center text-danger mt-3" 
                            th:text="${error}">
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center" style="background: #f8f9fa; border-radius: 0 0 15px 15px;">
                    <small class="text-muted">¿Olvidó su contraseña? <a href="/recuperar" class="text-primary">Recupérela aquí</a></small>
                </div>
            </div>
        </div>

    
        
    </body>
</html>
