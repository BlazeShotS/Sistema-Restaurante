<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Mostrar Platos</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"> 
    </head>
    <body>
        
        <!-- Encabezado tipo barra de navegación -->
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark py-3">
            <div class="container-fluid">
                
                <!-- Botón para dispositivos pequeños -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navegación principal -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/pedido/platos">
                                <i class="bi bi-list"></i> Mostrar Platos Completos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/cliente/loginCliente">
                                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/cliente/nuevo">
                                <i class="bi bi-person-plus"></i> Registrarse
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/compras/mostrarCarrito">
                                <i class="bi bi-cart"></i> Visualizar Pedidos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/trabajador/login">
                                <i class="bi bi-person-badge"></i> Acceso para Trabajadores
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        
        
        <main class="col-md-auto container mt-5">
            <h2 class="text-white bg-dark p-3" style="font-family: Arial;">Listado de platos</h2>
            <div class="row">
                <!-- Generando tarjetas para cada plato -->
                <div class="col-md-4 mb-4" th:each="plato : ${platos}">
                    <div class="card h-100 shadow">
                        <img th:src="${plato.rutaImagen}" class="card-img-top" alt="Imagen del Producto" style="max-height: 200px; object-fit: cover;">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${plato.nombre}"></h5>
                            <p class="card-text" th:text="${plato.descripcion}"></p>
                            <p class="card-text">
                                <strong>Precio:</strong> <span th:text="'S/ ' + ${plato.precio}"></span><br>
                                <strong>Stock:</strong> <span th:text="${plato.stock}" th:style="${plato.stock < 5} ? 'color: red; font-weight: bold;'"></span><br>
                                <strong>Fecha de Ingreso:</strong> <span th:text="${plato.fechaIngreso}"></span>
                            </p>
                        </div>
                        <div class="card-footer text-center">
                            
                             <form th:action="@{/compras/añadirAlCarrito}" method="post">
                                    <!-- El id del producto se envía como parámetro oculto -->
                                    <input type="hidden" name="idPlato" th:value="${plato.id_plato}" />
                                    <button type="submit" class="btn btn-success w-100">Seleccionar Plato</button>
                                </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        
        <footer class="bg-dark text-white text-center py-3">
            <div class="container">
                <p class="mb-1">© 2024 El Punto del sabor. Todos los derechos reservados.</p>
                <p class="mb-0">
                    <a href="/terminos" class="text-white text-decoration-none me-3">Términos y Condiciones</a>
                    <a href="/privacidad" class="text-white text-decoration-none">Política de Privacidad</a>
                </p>
            </div>
        </footer>
        
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    </body>
</html>
