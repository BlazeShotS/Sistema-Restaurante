<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Registrar Cliente</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"> <!-- Agrega Bootstrap Icons -->        
    </head>
    <body>
        
        <!-- Encabezado tipo barra de navegación -->
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark py-3">
            <div class="container-fluid">
                
                <!-- Botón para dispositivos pequeños -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Navegación principal -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto">
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/pedido/platos">
                                <i class="bi bi-list"></i> Mostrar Platos Completos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/cliente/loginCliente">
                                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/cliente/nuevo">
                                <i class="bi bi-person-plus"></i> Registrarse
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/compras/mostrarCarrito">
                                <i class="bi bi-cart"></i> Visualizar Pedidos
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white px-3" href="/trabajador/login">
                                <i class="bi bi-person-badge"></i> Acceso para Trabajadores
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        
        
        
        <main class="container my-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <form th:action="@{/cliente/guardar}" th:object="${cliente}" method="post">
                        <div class="card">
                            <div class="card-header text-center">
                                Registrarse
                            </div>
                            <div class="card-body">
                                
                                <div class="mb-3">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" th:field="*{nombre}" id="nombre"  placeholder="Ingrese su nombre" required>
                                </div>
                                <p th:if="${#fields.hasErrors('nombre')}"                       
                                   th:errors="*{nombre}" style="color: red;"> </p>

                                
                                 <div class="mb-3">
                                    <label for="apellido" class="form-label">Apellido</label>
                                    <input type="text" class="form-control" th:field="*{apellido}" id="apellido" placeholder="Ingrese su apellido" required>
                                </div>
                                <p th:if="${#fields.hasErrors('apellido')}"                       
                                   th:errors="*{apellido}" style="color: red;"> </p>
                                
                                
                                <div class="mb-3">
                                    <label for="telefono" class="form-label">N° de Celular:</label>
                                    <input type="text" class="form-control" th:field="*{telefono}" id="telefono" placeholder="Ingrese su número de Celular" required>
                                </div>
                                  <p th:if="${#fields.hasErrors('telefono')}"                       
                                   th:errors="*{telefono}" style="color: red;"> </p>
                                
                               
                                <div class="mb-3">
                                    <label for="correo" class="form-label">Correo:</label>
                                    <input type="email" class="form-control"  th:field="*{email}" id="email" placeholder="Ingrese su correo electrónico" required>
                                </div>
                                  <p th:if="${#fields.hasErrors('email')}"                       
                                   th:errors="*{email}" style="color: red;"> </p>
                                  
                                
                                <div class="mb-3">
                                    <label for="idCliente" class="form-label">Id(DNI):</label>
                                    <input type="text" class="form-control" th:field="*{idCliente}" id="idCliente"   placeholder="Ingrese sus Dni" required>
                                </div>
                                   <p th:if="${#fields.hasErrors('idCliente')}"                       
                                   th:errors="*{idCliente}" style="color: red;"> </p>
                                  
                                  
                                <div class="mb-3">
                                    <label for="password" class="form-label">Password:</label>
                                    <input type="text" class="form-control" th:field="*{password}" id="password" placeholder="Ingrese sus Contraseña" required>
                                </div>
                                   <p th:if="${#fields.hasErrors('password')}"                       
                                   th:errors="*{password}" style="color: red;"> </p>
                                
                                
                                <div class="text-center">
                                    <button type="submit" class="btn btn-primary">Registrarse</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        
        
        <footer class="bg-dark text-white text-center py-3">
            <div class="container">
                <p class="mb-1">© 2024 El Punto del sabor. Todos los derechos reservados.</p>
                <p class="mb-0">
                    <a href="/terminos" class="text-white text-decoration-none me-3">Términos y Condiciones</a>
                    <a href="/privacidad" class="text-white text-decoration-none">Política de Privacidad</a>
                </p>
            </div>
        </footer>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

        
    </body>
</html>
